<html lang="ru">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<title>FitPWA — фитнес-платформа для тренера и клиента</title>
<meta name="description" content="FitPWA — премиальное фитнес-приложение: тренировки, расписание, прогресс, чат с тренером и CRM для тренера."/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="FitPWA"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>window.lucide||document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"><\/script>')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#05070a; --p:#f8fafc; --s:#94a3b8; --s2:#64748b;
  --vio:#7c5cff; --cyan:#22d3ee;
  --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--p);
  font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.5;
  background-image:
    radial-gradient(1000px 700px at -10% -10%, rgba(124,92,255,.14), transparent 60%),
    radial-gradient(1000px 700px at 110% 110%, rgba(34,211,238,.10), transparent 60%);
  background-attachment:fixed;min-height:100vh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.98)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--p);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 13px;width:100%;outline:none;transition:border .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(124,92,255,.6);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
select option{background:#0b0e14}
input[type=checkbox]{width:auto;accent-color:#7c5cff}
label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--s);display:block;margin-bottom:5px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px}
.glass-sm{background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px}
.grad{background:linear-gradient(135deg,#7c5cff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-bg{background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff}
.grad-border{position:relative;border:1px solid transparent;background:
  linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.04)) padding-box,
  linear-gradient(135deg,rgba(124,92,255,.65),rgba(34,211,238,.65)) border-box}
.fade-in{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:11px 18px;font-size:13.5px;font-weight:700;border:1px solid var(--line2);background:rgba(255,255,255,.05);transition:filter .15s,transform .1s}
.btn:hover{border-color:rgba(124,92,255,.55)}
.btn:active{transform:scale(.98)}
.btn-g{background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff;border:none;box-shadow:0 10px 26px -10px rgba(124,92,255,.7)}
.btn-g:hover{filter:brightness(1.1)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:16px}
.btn-ic{width:38px;height:38px;padding:0;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--s)}
.btn-ic:hover{color:var(--p)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700;border:1px solid var(--line2);color:var(--s)}
.muted{color:var(--s)}.muted2{color:var(--s2)}.small{font-size:12px}.tiny{font-size:11px}
.dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.lucide{width:18px;height:18px;flex-shrink:0}
.lucide-sm{width:15px;height:15px}
.lucide-lg{width:22px;height:22px}

/* nav */
.side{width:250px;flex-shrink:0;border-right:1px solid var(--line);background:rgba(255,255,255,.03);backdrop-filter:blur(20px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
.nav-b{display:flex;align-items:center;gap:12px;width:100%;border-radius:20px;padding:11px 15px;font-size:14px;font-weight:600;color:var(--s);text-align:left;transition:background .15s,color .15s}
.nav-b:hover{background:rgba(255,255,255,.05);color:var(--p)}
.nav-b.on{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(34,211,238,.10));color:var(--p);border:1px solid rgba(124,92,255,.3)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(5,7,10,.85);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--s2)}
.bnav button.on{color:var(--p)}
.bnav button.on .lucide{color:var(--vio)}
@media(min-width:1024px){.bnav{display:none}.m-only{display:none!important}}
@media(max-width:1023px){.side{display:none}.d-only{display:none!important}}
.header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(5,7,10,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.header .flex-1{min-width:0}

/* progress ring */
.ringw{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ringw .val{position:absolute;text-align:center}

/* metrics */
.kpi{padding:16px;border-radius:24px}
.kpi .v{font-size:clamp(17px,5.4vw,23px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:11.5px;color:var(--s);font-weight:600;margin-top:1px}
.ic-box{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,211,238,.12));border:1px solid rgba(124,92,255,.3);color:#a78bfa}

/* rows & lists */
.row-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-i:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#7c5cff,#22d3ee)}
.av.sm{width:34px;height:34px;font-size:11px}
.chip{border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--s)}
.chip.on{background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(34,211,238,.15));border-color:rgba(124,92,255,.5);color:var(--p)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

/* modal / toast / overlay */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(2,4,8,.72);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:18px;overflow-y:auto}
.modal{background:rgba(13,17,26,.92);border:1px solid var(--line2);backdrop-filter:blur(22px);border-radius:26px;width:100%;max-width:520px;margin:auto;animation:fadeIn .25s ease both}
.modal-b{padding:20px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
#toast-root{position:fixed;bottom:80px;right:14px;z-index:120;display:flex;flex-direction:column;gap:8px}
@media(min-width:1024px){#toast-root{bottom:20px}}
.toast{background:rgba(13,17,26,.95);border:1px solid rgba(124,92,255,.45);border-radius:18px;padding:11px 16px;font-size:13px;font-weight:600;animation:fadeIn .25s ease}

/* rest overlay */
.rest-ov{position:fixed;inset:0;z-index:100;background:rgba(2,4,8,.86);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.preset{padding:6px 13px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--s)}
.preset.on{background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(34,211,238,.2));border-color:rgba(124,92,255,.55);color:var(--p)}

/* player */
.video-zone{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(600px 300px at 20% 0%, rgba(124,92,255,.35), transparent 60%),
             radial-gradient(500px 300px at 90% 100%, rgba(34,211,238,.28), transparent 60%),
             linear-gradient(160deg,#0b0e18,#05070a);
  border:1px solid var(--line)}
.video-zone .bars{display:none;align-items:flex-end;gap:4px;height:34px}
.video-zone.playing .bars{display:flex}
.video-zone.playing .vplay{display:none}
.bars i{width:6px;border-radius:4px;background:linear-gradient(180deg,#7c5cff,#22d3ee);animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:10px}50%{height:34px}}
.vplay{width:64px;height:64px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.55);border:1px solid var(--line2);backdrop-filter:blur(8px);color:#fff}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:none}
.set-done .set-name{color:var(--s2);text-decoration:line-through}
.check{width:36px;height:36px;border-radius:14px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--s2);flex-shrink:0}
.set-done .check{background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff;border:none}
.set-num{width:30px;height:30px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.ex-chip{flex-shrink:0;border-radius:18px;padding:9px 14px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--s);white-space:nowrap}
.ex-chip.on{background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(34,211,238,.15));border-color:rgba(124,92,255,.5);color:var(--p)}
.ex-chip.done{color:var(--cyan)}

/* toggle */
.tg{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;transition:background .2s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .2s}
.tg.on{background:linear-gradient(135deg,#7c5cff,#22d3ee)}
.tg.on::after{left:23px}

/* pro card */
.pro-card{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff}
.pro-card::after{content:'';position:absolute;top:-60%;left:-30%;width:60%;height:220%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}

/* schedule blocks */
.blk{border-radius:16px;padding:9px 11px;font-size:11.5px;font-weight:700;border:1px solid;margin-top:6px;cursor:pointer}
.b-p{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.4)}
.b-g{background:rgba(34,211,238,.13);border-color:rgba(34,211,238,.4)}
.b-o{background:linear-gradient(135deg,rgba(124,92,255,.20),rgba(34,211,238,.14));border-color:rgba(34,211,238,.45)}
.b-r{background:rgba(100,116,139,.12);border-color:rgba(100,116,139,.3);color:var(--s2)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:1023px){.week-grid{grid-template-columns:1fr}}
.day-col{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:20px;padding:10px;min-height:150px}

/* workouts constructor */
.lib-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:16px;padding:9px 12px;margin-top:7px;cursor:grab;font-size:13px;font-weight:600}
.lib-item:hover{border-color:rgba(124,92,255,.5);background:rgba(124,92,255,.07)}
.day-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:20px;padding:13px}
.day-card.sel{border-color:rgba(124,92,255,.55);background:linear-gradient(160deg,rgba(124,92,255,.10),rgba(34,211,238,.05))}
.drag-over{border-color:rgba(34,211,238,.7)!important;background:rgba(34,211,238,.06)!important}

/* bar chart */
.bar{fill:rgba(124,92,255,.4);transition:height .7s cubic-bezier(.2,.8,.2,1),y .7s cubic-bezier(.2,.8,.2,1)}
.bar.last{fill:url(#bg-grad)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}

/* --- адаптив: от 320px до ультрашироких --- */
@media(max-width:640px){
  .overlay{padding:10px}
  .header{padding:11px 12px;gap:8px}
  .header .rl{display:none}               /* роль — только иконкой */
  .kpi{padding:13px}
  .side{width:220px}
}
@media(max-width:380px){
  .bnav button{font-size:9px;gap:2px;height:58px}
  .chip{padding:6px 10px}
  .btn{padding:10px 14px;font-size:12.5px}
}
@media(min-width:1536px){
  .side{width:270px}
}
.ic-box,.btn,.btn-ic,.check,.vplay,.av{flex-shrink:0}
.lucide{max-width:none}
</style>
</head>

/* ---------- counters & charts ---------- */
function countUp(el){
  const target=parseFloat(el.dataset.count), dur=800, t0=performance.now(), suf=el.dataset.suf||'', pre=el.dataset.pre||'';
  function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), v=target*e;
    el.textContent=pre+(target%1? v.toFixed(1):Math.round(v).toLocaleString('ru-RU'))+suf;
    if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function runCounters(){ document.querySelectorAll('[data-count]').forEach(countUp); }
function ring(p,size,sw){
  const r=(size-sw)/2, C=2*Math.PI*r, off=C*(1-Math.min(1,Math.max(0,p)));
  return '<div class="ringw" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'"><defs><linearGradient id="rg'+size+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="'+sw+'"/>'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="url(#rg'+size+')" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+
  '<div class="val"><b style="font-size:'+(size/4.6)+'px">'+Math.round(p*100)+'%</b></div></div>';
}
function lineChart(data,w,h){
  if(data.length<2) return '';
  const vs=data.map(p=>p.v), min=Math.min.apply(null,vs), max=Math.max.apply(null,vs), span=(max-min)||1;
  const px=30,py=14,iw=w-px-10,ih=h-py-20;
  const pts=data.map((p,i)=>[px+iw*i/(data.length-1), py+ih*(1-(p.v-min)/span)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+' L'+pts[pts.length-1][0].toFixed(1)+' '+(py+ih)+' L'+pts[0][0].toFixed(1)+' '+(py+ih)+' Z';
  let dots='',labels='';
  data.forEach((p,i)=>{ dots+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="3.4" fill="#22d3ee"><title>'+p.d+': '+p.v+' кг</title></circle>';
    if(i%Math.ceil(data.length/5)===0||i===data.length-1) labels+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="10" fill="#64748b">'+p.d+'</text>'; });
  let grid=''; for(let g=0;g<3;g++){ const y=py+ih*g/2, v=max-(max-min)*g/2; grid+='<line x1="'+px+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="rgba(255,255,255,.06)"/><text x="'+(px-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#64748b">'+v.toFixed(1)+'</text>'; }
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#lg1)"/><path d="'+path+'" fill="none" stroke="#7c5cff" stroke-width="2.4" stroke-linejoin="round"/>'+dots+labels+'</svg>';
}
function barChart(data,w,h){
  const max=Math.max.apply(null,data.map(d=>d.v))||1, px=34,py=12,iw=w-px-8,ih=h-py-20, n=data.length;
  const bw=Math.min(26,iw/n*.55);
  let s='';
  data.forEach((d,i)=>{
    const x=px+iw*(i+.5)/n, bh=ih*d.v/max, y=py+ih-bh;
    s+='<rect class="bar'+(i===n-1?' last':'')+'" data-y="'+y.toFixed(1)+'" data-h="'+bh.toFixed(1)+'" x="'+(x-bw/2).toFixed(1)+'" y="'+(py+ih)+'" width="'+bw.toFixed(1)+'" height="0" rx="6"><title>'+d.m+': '+money(d.v)+'</title></rect>';
    if(i%2===0||i===n-1) s+='<text x="'+x.toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="10" fill="#64748b">'+d.m+'</text>';
  });
  let grid=''; for(let g=0;g<3;g++){ const y=py+ih*g/2, v=max*(1-g/2); grid+='<line x1="'+px+'" y1="'+y+'" x2="'+(w-8)+'" y2="'+y+'" stroke="rgba(255,255,255,.06)"/><text x="'+(px-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#64748b">'+Math.round(v/1000)+'k</text>'; }
  return '<svg id="barchart" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block"><defs><linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>'+grid+s+'</svg>';
}

function rtRun(){ clearInterval(RT.iv); RT.iv=setInterval(()=>{ RT.left--; paintRT(); if(RT.left<=0){ rtClose(); if(DB.settings.sound) beep(); toast('Отдых закончен — работаем! 💪'); } },1000); }

function paintRT(){
  const svg=document.getElementById('rt-ring'); if(!svg) return;

  svg.innerHTML='<circle cx="65" cy="65" r="54" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/><circle cx="65" cy="65" r="54" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*frac).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 65 65)"/>';

    '<div class="glass p-5"><b class="small">Доход по месяцам</b>'+barChart(m,560,220)+'</div>'+
    '<div class="glass p-5"><b class="small">Последние оплаты</b>'+
     DB.finance.last.map(p=>'<div class="row-i"><div class="av sm">'+p.n[0]+'</div><div class="flex-1"><div class="font-bold small">'+esc(p.n)+'</div><div class="tiny muted">'+p.d+'</div></div><span class="badge" style="'+(p.s==='Оплачено'?'color:#67e8f9;border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)':'color:#c4b5fd;border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.10)')+'">'+p.s+'</span><b>'+money(p.a)+'</b></div>').join('')+
    '</div>'+
   '</div>'
  );
}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  const app=document.getElementById('app');
  let html='';
  if(S.role==='client'){
    if(S.cView==='home') html=vHome();
    else if(S.cView==='player') html=vPlayer();
    else if(S.cView==='schedule') html=vScheduleC();
    else if(S.cView==='progress') html=vProgress();
    else if(S.cView==='chat') html=vChat();
    else html=vProfile();
  } else {
    if(S.tView==='dash') html=vDash();
    else if(S.tView==='clients') html=vClients();
    else if(S.tView==='workouts') html=S.progOpen!==null?peView():vWorkouts();
    else if(S.tView==='schedule') html=vTSchedule();
    else html=vFinance();
  }
  app.innerHTML=html;
  icons();
  runCounters();
  animateBars();
  if(S.role==='client'&&S.cView==='chat'){ const b=document.getElementById('chat-msgs'); if(b) b.scrollTop=b.scrollHeight; }
}

/* ================================================================
   ACTIONS
   ================================================================ */
const A={
  cNav(v){ S.cView=v; render(); window.scrollTo(0,0); },
  tNav(v){ S.tView=v; S.progOpen=null; render(); window.scrollTo(0,0); },
  switchRole(){ S.role=S.role==='client'?'trainer':'client'; DB.role=S.role; save(); S.progOpen=null; render(); window.scrollTo(0,0); toast(S.role==='client'?'Режим клиента':'Режим тренера'); },
  closeModal(){ closeModal(); },
  weekShift(d){ S.week=Math.max(0,S.week+d); render(); },
  selDay(i){ S.selDay=i; render(); },

  /* клиент: плеер */
  spEx(i){ DB.sp.cur=i; save(); render(); },
  spMove(d){ DB.sp.cur=Math.max(0,Math.min(WORKOUT.ex.length-1,DB.sp.cur+d)); save(); render(); },
  spPlay(i){ DB.sp.inputs['play'+i]=!DB.sp.inputs['play'+i]; save(); render(); },
  spInput(k,v){ DB.sp.inputs[k]=v; save(); },
  spSet(i,si){
    const done=DB.sp.done[i]=DB.sp.done[i]||[];
    done[si]=!done[si];
    save();
    if(done[si]){ if(DB.settings.vibrate&&navigator.vibrate) navigator.vibrate(60); if(DB.sp.cur<WORKOUT.ex.length-1||si<WORKOUT.ex[i].sets-1) rtStart(WORKOUT.ex[i].rest); }
    render();
  },
  spFinish(){ DB.sp={done:{},cur:0,inputs:{}}; save(); DB.me.streak++; DB.me.sessionsMonth++; save(); A.cNav('home'); toast('Тренировка завершена! Streak +1 🔥'); },

  /* клиент: расписание */
  book(day,si){
    const slots=[{t:'08:00',type:'G',title:'Кроссфит · группа'},{t:'10:00',type:'O',title:'Онлайн с тренером'},{t:'18:00',type:'P',title:'Персональная тренировка'}];
    const s=slots[si];
    DB.bookings=DB.bookings.filter(b=>!(b.day===day&&b.t===s.t));
    DB.bookings.push({day:day,t:s.t,title:s.title,type:s.type});
    DB.requests.push({id:uid(),name:'Ирина Соколова',slot:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][day]+' '+s.t+' · '+({P:'Персональная',G:'Групповая',O:'Онлайн'})[s.type]});
    save(); render(); toast('Вы записаны: '+s.t+' ✅');
  },
  unBook(day,bi){
    const mine=DB.bookings.filter(b=>b.day===day);
    const b=mine[bi]; if(!b) return;
    DB.bookings=DB.bookings.filter(x=>x!==b); save(); render(); toast('Запись отменена');
  },

  /* клиент: прогресс */
  measModal(){
    openModal(mHead('Новый замер')+'<div class="modal-b"><div class="grid grid-cols-2 gap-3">'+
     Object.keys(DB.measures).map(k=>'<div><label>'+k+', см</label><input id="ms-'+k+'" type="number" step="0.5" value="'+DB.measures[k]+'"/></div>').join('')+
    '</div></div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Отмена</button><button class="btn btn-g" onclick="A.measSave()">Сохранить</button></div>');
  },
  measSave(){
    Object.keys(DB.measures).forEach(k=>{ const v=parseFloat(document.getElementById('ms-'+k).value); if(v) DB.measures[k]=v; });
    save(); closeModal(); render(); toast('Замер сохранён');
  },

  /* клиент: чат */
  chatSend(){
    const inp=document.getElementById('chat-inp'); const txt=inp.value.trim(); if(!txt) return;
    const d=new Date();
    DB.chat.push({who:'me',txt:txt,t:('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)});
    save(); inp.value=''; render();
    setTimeout(()=>{
      DB.chat.push({who:'…',txt:'печатает…',t:''});
      render();
      setTimeout(()=>{
        DB.chat.pop();
        const pool=['Отлично! Держи темп 💪','Записал, скорректируем план на неделю','Так и планировал. Отдых — 90 секунд между подходами','Молодец! Завтра ноги — не забудь про разминку','Хорошо, посмотрим на замерах в конце недели 🔥'];
        const d2=new Date();
        DB.chat.push({who:'tr',txt:pool[Math.floor(Math.random()*pool.length)],t:('0'+d2.getHours()).slice(-2)+':'+('0'+d2.getMinutes()).slice(-2)});
        save(); render();
      },1400);
    },700);
  },

  /* клиент: профиль */
  tgl(k){ DB.settings[k]=!DB.settings[k]; save(); render(); },

  /* тренер: клиенты */
  clSearch(q){ S.libQ=q; const el=document.getElementById('cl-list'); if(el){ el.innerHTML=clientsListHTML(q); icons(); } },
  clientModal(){
    openModal(mHead('Новый клиент')+'<div class="modal-b space-y-3">'+
     '<div><label>Имя и фамилия</label><input id="nc-name" placeholder="Например: Павел Зайцев"/></div>'+
     '<div><label>Телефон</label><input id="nc-phone" placeholder="+7 ___ ___-__-__"/></div>'+
     '<div><label>Цель</label><input id="nc-goal" placeholder="Снижение веса / масса / тонус"/></div>'+
     '<div><label>Абонемент</label><select id="nc-fee"><option value="7000">Standard · 7 000 ₽/мес</option><option value="8000">Premium · 8 000 ₽/мес</option><option value="12000">Elite · 12 000 ₽/мес</option></select></div>'+
    '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Отмена</button><button class="btn btn-g" onclick="A.clientAdd()">Добавить</button></div>');
  },
  clientAdd(){
    const name=document.getElementById('nc-name').value.trim();
    if(!name){ toast('Укажите имя'); return; }
    DB.tClients.unshift({id:uid(),name:name,phone:document.getElementById('nc-phone').value,goal:document.getElementById('nc-goal').value||'—',status:'Новый',next:'—',program:'Подбор программы',fee:+document.getElementById('nc-fee').value});
    save(); closeModal(); render(); toast('Клиент добавлен ✅');
  },
  clientInfo(id){
    const c=DB.tClients.find(x=>x.id===id); if(!c) return;
    openModal(mHead(esc(c.name))+'<div class="modal-b space-y-2">'+
     '<div class="flex justify-between"><span class="muted small">Статус</span><span class="badge" style="'+ST[c.status]+'">'+c.status+'</span></div>'+
     '<div class="flex justify-between"><span class="muted small">Цель</span><b class="small">'+esc(c.goal)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Программа</span><b class="small">'+esc(c.program)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Следующая сессия</span><b class="small">'+c.next+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Телефон</span><b class="small">'+esc(c.phone)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Email</span><b class="small">'+esc(c.email)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Абонемент</span><b class="small">'+money(c.fee)+'/мес</b></div>'+
    '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Закрыть</button></div>');
  },

  /* тренер: заявки */
  reqOk(id){ DB.requests=DB.requests.filter(r=>r.id!==id); save(); render(); toast('Заявка принята ✅'); },
  reqNo(id){ DB.requests=DB.requests.filter(r=>r.id!==id); save(); render(); toast('Заявка отклонена'); },

  /* тренер: конструктор */
  peOpen(id){
    const p=id?DB.programs.find(x=>x.id===id):null;
    PE={name:p?p.name:'',client:DB.tClients[0].name,days:p?Array.from({length:p.days},(_,i)=>({title:'День '+(i+1),ex:[]})):[{title:'День 1',ex:[]}],srcId:p?p.id:null};
    S.peDay=0; S.progOpen=true; render(); window.scrollTo(0,0);
  },
  peClose(){ S.progOpen=null; render(); },
  peSelect(i){ S.peDay=i; render(); },
  peAddDay(){ PE.days.push({title:'День '+(PE.days.length+1),ex:[]}); S.peDay=PE.days.length-1; render(); },
  peDelDay(i){ PE.days.splice(i,1); if(!PE.days.length) PE.days.push({title:'День 1',ex:[]}); S.peDay=0; render(); },
  peDelEx(di,xi){ PE.days[di].ex.splice(xi,1); render(); },
  peAdd(name){ PE.days[S.peDay].ex.push(name); render(); toast('Добавлено: '+name); },
  peDrop(ev,di){
    ev.preventDefault(); S.peDay=di;
    const txt=ev.dataTransfer.getData('text/plain');
    if(!txt) return;
    if(txt.indexOf('day:')===0){ const from=+txt.slice(4); const d=PE.days.splice(from,1)[0]; PE.days.splice(di,0,d); S.peDay=di; }
    else PE.days[di].ex.push(txt);
    render();
  },
  peDayDrag(i){ event.dataTransfer.setData('text/plain','day:'+i); },
  peLibDrag(name){ event.dataTransfer.setData('text/plain',name); },
  libGroup(g){ S.libGroup=g; S.libQ=''; render(); },
  libSearch(q){ S.libQ=q; const el=document.getElementById('lib-list'); if(el){ const items=LIB[S.libGroup].filter(x=>!q||x.toLowerCase().includes(q.toLowerCase())); el.innerHTML=items.map(x=>'<div class="lib-item" draggable="true" ondragstart="A.peLibDrag(\''+x.replace(/'/g,"\\'")+'\')" onclick="A.peAdd(\''+x.replace(/'/g,"\\'")+'\')"><span>'+esc(x)+'</span>'+ic('plus','lucide-sm muted')+'</div>').join(''); icons(); } },
  peSave(){
    const name=(PE.name||'').trim()||'Новая программа';
    const filled=PE.days.filter(d=>d.ex.length).length;
    if(!filled){ toast('Добавьте упражнения хотя бы в один день'); return; }
    if(PE.srcId){ const p=DB.programs.find(x=>x.id===PE.srcId); p.name=name; p.days=filled; p.ex=PE.days.reduce((a,d)=>a+d.ex.length,0); }
    else DB.programs.unshift({id:uid(),name:name,days:filled,ex:PE.days.reduce((a,d)=>a+d.ex.length,0),tag:'Новая'});
    save(); S.progOpen=null; S.tView='workouts'; render(); toast('Программа сохранена ✅');
  },

  /* тренер: расписание */
  sessModal(){
    openModal(mHead('Новая сессия')+'<div class="modal-b space-y-3">'+
     '<div><label>Клиент / группа</label><select id="ns-name">'+DB.tClients.map(c=>'<option>'+esc(c.name)+'</option>').join('')+'<option>Группа · Кроссфит</option><option>Группа · Стретчинг</option></select></div>'+
     '<div class="grid grid-cols-2 gap-3"><div><label>День недели</label><select id="ns-day">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>'<option value="'+i+'">'+d+'</option>').join('')+'</select></div>'+
     '<div><label>Время</label><input id="ns-time" type="time" value="09:00"/></div></div>'+
     '<div><label>Тип</label><select id="ns-type"><option value="P">Персональная</option><option value="G">Групповая</option><option value="O">Онлайн</option><option value="R">Отдых</option></select></div>'+
    '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Отмена</button><button class="btn btn-g" onclick="A.sessAdd()">Добавить</button></div>');
  },
  sessAdd(){
    DB.tSchedule.push({d:+document.getElementById('ns-day').value,t:document.getElementById('ns-time').value,name:document.getElementById('ns-name').value,type:document.getElementById('ns-type').value});
    save(); closeModal(); render(); toast('Сессия добавлена ✅');
  },
  sessInfo(day,t){
    const s=DB.tSchedule.find(x=>x.d===day&&x.t===t); if(!s) return;
    const names={P:'Персональная',G:'Групповая',O:'Онлайн',R:'Отдых'};
    openModal(mHead(esc(s.name))+'<div class="modal-b space-y-2">'+
     '<div class="flex justify-between"><span class="muted small">Тип</span><b class="small">'+names[s.type]+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">День</span><b class="small">'+['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'][day]+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Время</span><b class="small">'+s.t+'</b></div>'+
    '</div><div class="modal-f"><button class="btn btn-g" onclick="A.closeModal()">Ок</button></div>');
  },

  /* таймер */
  rtSkip(){ rtSkip(); },
  rtAdd(){ rtAdd(); },
  rtPreset(s){ RT.total=s; RT.left=s; paintRT(); }
};

/* ---------- init ---------- */
load();
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
