<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#05070a"/>
<title>FitPWA — фитнес-платформа для тренера и клиента</title>
<meta name="description" content="FitPWA — премиальное фитнес-приложение: тренировки, расписание, прогресс, чат с тренером и CRM для тренера."/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="FitPWA"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>window.lucide||document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"><\/script>')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#05070a; --p:#f8fafc; --s:#94a3b8; --s2:#64748b;
  --a:#7c5cff; --b:#22d3ee;
  --aT:rgba(124,92,255,.20); --aB:rgba(124,92,255,.42); --aSoft:rgba(124,92,255,.16); --aG:rgba(124,92,255,.35);
  --bT:rgba(34,211,238,.13); --bB:rgba(34,211,238,.42); --bT2:rgba(34,211,238,.08); --bG:rgba(34,211,238,.28);
  --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
}
body.theme-cyber{
  --a:#00f0ff; --b:#ff2bd6;
  --aT:rgba(0,240,255,.15); --aB:rgba(0,240,255,.5); --aSoft:rgba(0,240,255,.13); --aG:rgba(0,240,255,.30);
  --bT:rgba(255,43,214,.12); --bB:rgba(255,43,214,.5); --bT2:rgba(255,43,214,.08); --bG:rgba(255,43,214,.26);
  --bg:#020308; --p:#eafcff; --s:#7fb0bf; --s2:#4f7380;
  --glass:rgba(0,240,255,.05); --glass2:rgba(0,240,255,.04);
  --line:rgba(0,240,255,.13); --line2:rgba(0,240,255,.24);
  background-image:
    radial-gradient(900px 600px at -10% -10%, rgba(0,240,255,.14), transparent 60%),
    radial-gradient(1000px 700px at 110% 110%, rgba(255,43,214,.13), transparent 60%),
    repeating-linear-gradient(0deg, rgba(0,240,255,.03) 0 1px, transparent 1px 46px),
    repeating-linear-gradient(90deg, rgba(0,240,255,.03) 0 1px, transparent 1px 46px);
}
body.theme-cyber::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);opacity:.5}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--p);
  font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.5;
  background-image:
    radial-gradient(1000px 700px at -10% -10%, rgba(124,92,255,.14), transparent 60%),
    radial-gradient(1000px 700px at 110% 110%, rgba(34,211,238,.10), transparent 60%);
  background-attachment:fixed;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
  font-variant-numeric:tabular-nums;
}
::selection{background:var(--aB)}
:focus-visible{outline:2px solid var(--aB);outline-offset:2px;border-radius:8px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.98)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--p);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 13px;width:100%;outline:none;transition:border .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--aB);box-shadow:0 0 0 3px var(--aSoft)}
select option{background:#0b0e14}
input[type=checkbox]{width:auto;accent-color:var(--a)}
label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--s);display:block;margin-bottom:5px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 20px 50px -24px rgba(0,0,0,.65)}
.glass-sm{background:var(--glass2);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card-hover{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card-hover:hover{transform:translateY(-3px);border-color:var(--aB);box-shadow:0 18px 44px -20px var(--aB)}
.grad{background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-bg{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.grad-border{position:relative;border:1px solid transparent;background:
  linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.04)) padding-box,
  linear-gradient(135deg,var(--aB),var(--bB)) border-box}
.grad-border::before,.grad-border::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--a);opacity:0;transition:opacity .2s}
.grad-border::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.grad-border::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
body.theme-cyber .grad-border::before,body.theme-cyber .grad-border::after{opacity:.9}
body.theme-cyber .grad{text-shadow:0 0 16px var(--aB)}
.fade-in{animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:11px 18px;font-size:13.5px;font-weight:700;border:1px solid var(--line2);background:rgba(255,255,255,.05);transition:filter .15s,transform .1s}
.btn:hover{border-color:var(--aB)}
.btn:active{transform:scale(.98)}
.btn-g{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:none;box-shadow:0 10px 26px -10px var(--aB)}
.btn-g:hover{filter:brightness(1.1)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:16px}
.btn-ic{width:38px;height:38px;padding:0;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--s)}
.btn-ic:hover{color:var(--p)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700;border:1px solid var(--line2);color:var(--s)}
.muted{color:var(--s)}.muted2{color:var(--s2)}.small{font-size:12px}.tiny{font-size:11px}
.dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.lucide{width:18px;height:18px;flex-shrink:0}
.lucide-sm{width:15px;height:15px}
.lucide-lg{width:22px;height:22px}

/* nav */
.side{width:250px;flex-shrink:0;border-right:1px solid var(--line);background:rgba(255,255,255,.03);backdrop-filter:blur(20px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-left)) 22px 14px}
.nav-b{display:flex;align-items:center;gap:12px;width:100%;border-radius:20px;padding:11px 15px;font-size:14px;font-weight:600;color:var(--s);text-align:left;transition:background .15s,color .15s}
.nav-b:hover{background:rgba(255,255,255,.05);color:var(--p)}
.nav-b.on{background:linear-gradient(135deg,var(--aT),var(--bT));color:var(--p);border:1px solid var(--aB)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(5,7,10,.85);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom),6px)}
.bnav button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--s2)}
.bnav button.on{color:var(--p)}
.bnav button.on .lucide{color:var(--vio)}
@media(min-width:1024px){.bnav{display:none}.m-only{display:none!important}}
@media(max-width:1023px){.side{display:none}.d-only{display:none!important}}
.header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 18px 14px;background:rgba(5,7,10,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.header .flex-1{min-width:0}

/* progress ring */
.ringw{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ringw .val{position:absolute;text-align:center}

/* metrics */
.kpi{padding:16px;border-radius:24px}
.kpi .v{font-size:clamp(17px,5.4vw,23px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:11.5px;color:var(--s);font-weight:600;margin-top:1px}
.ic-box{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--aT);border:1px solid var(--aB);color:var(--a)}

/* rows & lists */
.row-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-i:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;background:linear-gradient(135deg,var(--a),var(--b))}
.av.sm{width:34px;height:34px;font-size:11px}
.chip{border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--s)}
.chip.on{background:linear-gradient(135deg,var(--aT),var(--bT));border-color:var(--aB);color:var(--p)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

/* modal / toast / overlay */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(2,4,8,.72);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overflow-y:auto}
.modal{background:rgba(13,17,26,.92);border:1px solid var(--line2);backdrop-filter:blur(22px);border-radius:26px;width:100%;max-width:520px;margin:auto;animation:fadeIn .25s ease both}
.modal.wide{max-width:780px}
.modal-b{padding:20px;max-height:70vh;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
#toast-root{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:calc(14px + env(safe-area-inset-right));z-index:120;display:flex;flex-direction:column;gap:8px}
@media(min-width:1024px){#toast-root{bottom:20px}}
.toast{background:rgba(13,17,26,.95);border:1px solid var(--aB);border-radius:18px;padding:11px 16px;font-size:13px;font-weight:600;animation:fadeIn .25s ease}

/* rest overlay */
.rest-ov{position:fixed;inset:0;z-index:100;background:rgba(2,4,8,.86);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.preset{padding:6px 13px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--s)}
.preset.on{background:linear-gradient(135deg,var(--aT),var(--bT));border-color:var(--aB);color:var(--p)}

/* player */
.video-zone{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(600px 300px at 20% 0%, var(--aG), transparent 60%),
             radial-gradient(500px 300px at 90% 100%, var(--bG), transparent 60%),
             linear-gradient(160deg,#0b0e18,#05070a);
  border:1px solid var(--line)}
.video-zone .bars{display:none;align-items:flex-end;gap:4px;height:34px}
.video-zone.playing .bars{display:flex}
.video-zone.playing .vplay{display:none}
.bars i{width:6px;border-radius:4px;background:linear-gradient(180deg,var(--a),var(--b));animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:10px}50%{height:34px}}
.vplay{width:64px;height:64px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.55);border:1px solid var(--line2);backdrop-filter:blur(8px);color:#fff}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:none}
.set-done .set-name{color:var(--s2);text-decoration:line-through}
.check{width:36px;height:36px;border-radius:14px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--s2);flex-shrink:0}
.set-done .check{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:none}
.set-num{width:30px;height:30px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.ex-chip{flex-shrink:0;border-radius:18px;padding:9px 14px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--s);white-space:nowrap}
.ex-chip.on{background:linear-gradient(135deg,var(--aT),var(--bT));border-color:var(--aB);color:var(--p)}
.ex-chip.done{color:var(--cyan)}

/* toggle */
.tg{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;transition:background .2s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .2s}
.tg.on{background:linear-gradient(135deg,var(--a),var(--b))}
.tg.on::after{left:23px}

/* pro card */
.pro-card{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.pro-card::after{content:'';position:absolute;top:-60%;left:-30%;width:60%;height:220%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}

/* schedule blocks */
.blk{border-radius:16px;padding:9px 11px;font-size:11.5px;font-weight:700;border:1px solid;margin-top:6px;cursor:pointer}
.b-p{background:var(--aT);border-color:var(--aB)}
.b-g{background:var(--bT);border-color:var(--bB)}
.b-o{background:linear-gradient(135deg,var(--aT),var(--bT));border-color:var(--bB)}
.b-r{background:rgba(100,116,139,.12);border-color:rgba(100,116,139,.3);color:var(--s2)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:1023px){.week-grid{grid-template-columns:1fr}}
.day-col{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:20px;padding:10px;min-height:150px}

/* workouts constructor */
.lib-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:16px;padding:9px 12px;margin-top:7px;cursor:grab;font-size:13px;font-weight:600}
.lib-item:hover{border-color:var(--aB);background:var(--aSoft)}
.day-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:20px;padding:13px}
.day-card.sel{border-color:var(--aB);background:linear-gradient(160deg,var(--aT),var(--bT2))}
.drag-over{border-color:var(--bB)!important;background:var(--bT2)!important}

/* bar chart */
.bar{fill:var(--a);opacity:.42;transition:height .7s cubic-bezier(.2,.8,.2,1),y .7s cubic-bezier(.2,.8,.2,1)}
.bar.last{fill:url(#bg-grad)}
.rpe-row{display:flex;gap:5px;align-items:center;padding:2px 0 8px 38px;flex-wrap:wrap}
.rpe-row .chip{padding:2px 9px;font-size:10.5px}
#printArea{display:none}
@media print{
  body{background:#fff!important;color:#000!important}
  body>*{display:none!important}
  body.theme-cyber::after{display:none!important}
  #printArea{display:block!important;padding:10mm;color:#000;background:#fff;font-family:Arial,sans-serif}
  #printArea h1{font-size:22px;margin-bottom:8px}
  #printArea h3{margin:12px 0 4px}
  #printArea table{width:100%;border-collapse:collapse;margin:8px 0}
  #printArea td,#printArea th{border:1px solid #999;padding:6px 9px;font-size:12px;text-align:left}
}
.typing i{width:5px;height:5px;border-radius:99px;background:var(--s);display:inline-block;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}

/* theme helpers */
.st-act{color:#67e8f9;border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.st-ren,.st-pend,.badge-ai{color:#c4b5fd;border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.10)}
.st-new{color:#cbd5e1;border-color:rgba(148,163,184,.35);background:rgba(148,163,184,.08)}
body.theme-cyber .st-act{color:var(--a);border-color:var(--aB);background:var(--aSoft)}
body.theme-cyber .st-ren,body.theme-cyber .st-pend,body.theme-cyber .badge-ai{color:#ff9df0;border-color:var(--bB);background:var(--bT)}
.bub-ai{background:var(--aSoft)!important}
.bub-me{background:linear-gradient(135deg,var(--aT),var(--bT))!important}
.on-dot{color:var(--b)}
.pbar-fill{background:linear-gradient(90deg,var(--a),var(--b))}
.dot-a{background:var(--a)}
.ai-tip{color:var(--b)}
body.theme-cyber .glass{box-shadow:inset 0 1px 0 rgba(0,240,255,.09), 0 0 30px -12px rgba(0,240,255,.28)}
body.theme-cyber .glass-sm{box-shadow:inset 0 1px 0 rgba(0,240,255,.08)}
body.theme-cyber .btn-g{box-shadow:0 0 24px -6px var(--bB)}
body.theme-cyber .kpi .v,body.theme-cyber .timer-val b{font-family:'Share Tech Mono',monospace;letter-spacing:0}
body.theme-cyber .side .grad{font-family:'Orbitron','Manrope',sans-serif;letter-spacing:.1em}

/* --- адаптив: от 320px до ультрашироких --- */
@media(max-width:640px){
  .overlay{padding:max(10px,env(safe-area-inset-top)) 10px}
  .header{padding:max(11px,env(safe-area-inset-top)) 12px 11px;gap:8px}
  .header .rl{display:none}               /* роль — только иконкой */
  .kpi{padding:13px}
  .side{width:220px}
}
@media(max-width:380px){
  .bnav button{font-size:9px;gap:2px;height:58px}
  .chip{padding:6px 10px}
  .btn{padding:10px 14px;font-size:12.5px}
}
@media(min-width:1536px){
  .side{width:270px}
}
.ic-box,.btn,.btn-ic,.check,.vplay,.av{flex-shrink:0}
.lucide{max-width:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="rest-overlay"></div>
<div id="toast-root"></div>
<div id="printArea"></div>
<script>
'use strict';
/* ============ FitPWA — single-file PWA (vanilla JS) ============ */

/* ---------- store ---------- */
const LS='fitpwa-v1';
let DB=null;
function seed(){
  return {
    role:'client',
    settings:{push:true,sound:true,vibrate:false,offline:true},
    // клиент
    me:{name:'Ирина Соколова',plan:'PRO Member',planUntil:'12.12.2026',streak:12,sessionsMonth:18,volume:12450,fee:7500},

    el.textContent=pre+(target%1? v.toFixed(1):Math.round(v).toLocaleString('ru-RU'))+suf;

}

function ring(p,size,sw){
  const r=(size-sw)/2, C=2*Math.PI*r, off=C*(1-Math.min(1,Math.max(0,p))), tc2=tc();
  return '<div class="ringw" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'"><defs><linearGradient id="rg'+size+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+tc2.a+'"/><stop offset="1" stop-color="'+tc2.b+'"/></linearGradient></defs>'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="'+sw+'"/>'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="url(#rg'+size+')" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+
  '<div class="val"><b style="font-size:'+(size/4.6)+'px">'+Math.round(p*100)+'%</b></div></div>';
}
function lineChart(data, w, h){
  if(data.length<2) return '';
  const cc=tc();
  const vs=data.map(p=>p.v), min=Math.min.apply(null,vs), max=Math.max.apply(null,vs), span=(max-min)||1;
  const px=30,py=14,iw=w-px-10,ih=h-py-20;
  const pts=data.map((p,i)=>[px+iw*i/(data.length-1), py+ih*(1-(p.v-min)/span)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+' L'+pts[pts.length-1][0].toFixed(1)+' '+(py+ih)+' L'+pts[0][0].toFixed(1)+' '+(py+ih)+' Z';
  let dots='',labels='';
  data.forEach((p,i)=>{ dots+='<circle cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="3.4" fill="'+cc.b+'"><title>'+p.d+': '+p.v+' кг</title></circle>';
    if(i%Math.ceil(data.length/5)===0||i===data.length-1) labels+='<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="10" fill="#64748b">'+p.d+'</text>'; });
  let grid=''; for(let g=0;g<3;g++){ const y=py+ih*g/2, v=max-(max-min)*g/2; grid+='<line x1="'+px+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="rgba(255,255,255,.06)"/><text x="'+(px-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#64748b">'+v.toFixed(1)+'</text>'; }
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+cc.a+'" stop-opacity=".35"/><stop offset="1" stop-color="'+cc.a+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#lg1)"/><path d="'+path+'" fill="none" stroke="'+cc.a+'" stroke-width="2.4" stroke-linejoin="round"/>'+dots+labels+'</svg>';
}
function barChart(data,w,h){
  const cc=tc();
  const max=Math.max.apply(null,data.map(d=>d.v))||1, px=34,py=12,iw=w-px-8,ih=h-py-20, n=data.length;
  const bw=Math.min(26,iw/n*.55);
  let s='';
  data.forEach((d,i)=>{
    const x=px+iw*(i+.5)/n, bh=ih*d.v/max, y=py+ih-bh;
    s+='<rect class="bar'+(i===n-1?' last':'')+'" data-y="'+y.toFixed(1)+'" data-h="'+bh.toFixed(1)+'" x="'+(x-bw/2).toFixed(1)+'" y="'+(py+ih)+'" width="'+bw.toFixed(1)+'" height="0" rx="6"><title>'+d.m+': '+money(d.v)+'</title></rect>';
    if(i%2===0||i===n-1) s+='<text x="'+x.toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-size="10" fill="#64748b">'+d.m+'</text>';
  });
  let grid=''; for(let g=0;g<3;g++){ const y=py+ih*g/2, v=max*(1-g/2); grid+='<line x1="'+px+'" y1="'+y+'" x2="'+(w-8)+'" y2="'+y+'" stroke="rgba(255,255,255,.06)"/><text x="'+(px-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#64748b">'+Math.round(v/1000)+'k</text>'; }
  return '<svg id="barchart" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block"><defs><linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+cc.a+'"/><stop offset="1" stop-color="'+cc.b+'"/></linearGradient></defs>'+grid+s+'</svg>';
}

  return {cur:cur, start:start, delta:+(cur-start).toFixed(1), weeks:weeks, slope:slope,

}

function aiInsight(){

function parseSecs(r){ if(!r) return 60; const m=/(\d+)\s*мин/.exec(r); if(m) return +m[1]*60; const m2=/(\d+)\s*сек/.exec(r); if(m2) return +m2[1]; return 60; }
function fmtT2(s){ const m=Math.floor(s/60), ss=s%60; return (m?m+':'+('0'+ss).slice(-2):ss+' с'); }
let SETT=null;
function aiSuggestPlan(e){
  const range=e.reps.split('-'); const top=parseInt(range[1]||range[0]), low=parseInt(range[0]);
  let w=e.weight, reps=low;
  const h=DB.exHistory.slice().reverse().find(x=>x.name===e.name);
  if(h){
    if(h.rpe>=9){ w=h.weight; reps=Math.min(top,h.reps+1); }
    else if(h.reps>=top && h.weight>=e.weight){ w=e.weight+(e.weight<10?2:2.5); reps=low; }
    else if(h.reps<=low-3){ w=Math.max(1,Math.round(h.weight*0.9)); reps=low; }
    else { w=h.weight; reps=Math.min(top,h.reps+1); }
  }
  return {w:w,reps:reps};
}
function aiSuggest(e){
  const h=DB.exHistory.slice().reverse().find(x=>x.name===e.name);
  if(!h) return 'Вес уже подобран — просто отмечай подходы галочками.';
  const plan=aiSuggestPlan(e);
  const range=e.reps.split('-'); const top=parseInt(range[1]||range[0]), low=parseInt(range[0]);
  if(h.reps>=top && h.weight>=e.weight) return 'Прошлый раз '+h.weight+' кг ×'+h.reps+' — рост! Ставлю '+plan.w+' кг ×'+plan.reps+'. Последний подход до отказа.';
  if(h.reps<=low-3) return 'В прошлый раз '+h.weight+' кг ×'+h.reps+' — сбрасываю до '+plan.w+' кг, вернём технику.';
  return 'Прошлый раз '+h.weight+' кг ×'+h.reps+' — держу вес, цель '+plan.reps+' повторений.';
}

function render(){
  const app=document.getElementById('app');
  let html='';
  if(S.role==='client'){
    if(S.cView==='home') html=vHome();
    else if(S.cView==='player') html=vPlayer();
    else if(S.cView==='schedule') html=vScheduleC();
    else if(S.cView==='progress') html=vProgress();
    else if(S.cView==='chat') html=vChat();
    else html=vProfile();
  } else {
    if(S.tView==='dash') html=vDash();
    else if(S.tView==='clients') html=vClients();

    else if(S.tView==='schedule') html=vTSchedule();

  animateBars();

const A={
  cNav(v){ S.cView=v; render(); window.scrollTo(0,0); },

  /* клиент: плеер */
  spEx(i){ DB.sp.cur=i; save(); render(); },
  spMove(d){ DB.sp.cur=Math.max(0,Math.min(WORKOUT.ex.length-1,DB.sp.cur+d)); save(); render(); },
  spPlay(i){ DB.sp.inputs['play'+i]=!DB.sp.inputs['play'+i]; save(); render(); },
  spInput(k,v){ DB.sp.inputs[k]=v; save(); },
  spSet(i,si){
    const done=DB.sp.done[i]=DB.sp.done[i]||[];
    done[si]=!done[si];
    save();
    if(done[si]){
      if(DB.settings.vibrate&&navigator.vibrate) navigator.vibrate(60);
      if(doneSets()>=totalSets()){ render(); setTimeout(()=>A.spFinish(true),700); return; }
      rtStart(WORKOUT.ex[i].rest);
    }
    render();
  },
  spRpe(i,si,v){ DB.sp.inputs['rpe'+i+'_'+si]=v; save(); render(); },
  setTimeStart(i,si){
    const done=DB.sp.done[i]||[]; if(done[si]) return;
    if(SETT&&SETT.iv) clearInterval(SETT.iv);
    const secs=parseSecs(WORKOUT.ex[i].reps);
    SETT={i:i,si:si,left:secs,iv:null};
    const tick=()=>{ const el=document.getElementById('td-'+i+'_'+si);
      if(!el){ clearInterval(SETT.iv); SETT=null; return; }
      SETT.left--; el.textContent=fmtT2(Math.max(0,SETT.left));
      if(SETT.left<=3&&SETT.left>0&&DB.settings.vibrate&&navigator.vibrate) navigator.vibrate(150);
      if(SETT.left<=0){ clearInterval(SETT.iv); SETT=null; if(DB.settings.sound) beep(); A.spSet(i,si); } };
    tick(); SETT.iv=setInterval(tick,1000);
  },
  spFinish(auto){
    rtClose();
    WORKOUT.ex.forEach((e,i)=>{
      const plan=aiSuggestPlan(e);
      const pairs=[]; const rpes=[];
      for(let si=0;si<e.sets;si++){
        const wv=parseFloat(DB.sp.inputs['w'+i+'_'+si] ?? plan.w), rv=parseFloat(DB.sp.inputs['r'+i+'_'+si] ?? plan.reps);
        if(wv&&rv) pairs.push([wv,rv]);
        const rp=parseFloat(DB.sp.inputs['rpe'+i+'_'+si]); if(rp) rpes.push(rp);
      }
      if(!pairs.length) return;
      const maxW=Math.max.apply(null,pairs.map(p=>p[0]));
      const reps=Math.max.apply(null,pairs.filter(p=>p[0]===maxW).map(p=>p[1]));
      DB.exHistory.push({name:e.name,weight:maxW,reps:reps,rpe:rpes.length?Math.max.apply(null,rpes):null,date:new Date().toISOString().slice(0,10)});
    });
    if(DB.exHistory.length>200) DB.exHistory=DB.exHistory.slice(-200);
    DB.sp={done:{},cur:0,inputs:{}}; save(); DB.me.streak++; DB.me.sessionsMonth++; save(); A.cNav('home');
    toast(auto?'Все подходы сделаны! +1 день к streak 🔥':'Тренировка завершена! Streak +1 🔥');
  },

  /* клиент: расписание */
  book(day,si){

    save(); render(); toast('Вы записаны: '+wd3(day)+' '+s.t+' ✅');
  },

    let reply='';

  /* скан техники камерой */
  async poseOpen(){
    openModal(mHead(ic('video')+' Скан техники · приседания')+
     '<div class="modal-b">'+
      '<div style="position:relative;border-radius:16px;overflow:hidden;background:#000">'+
       '<video id="pm-video" playsinline muted style="width:100%;display:block;transform:scaleX(-1)"></video>'+
       '<canvas id="pm-cv" style="position:absolute;inset:0;width:100%;height:100%"></canvas>'+
       '<div id="pm-badges" style="position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end"></div>'+
       '<div id="pm-status" style="position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:rgba(2,4,8,.6);padding:4px 9px;border-radius:8px;color:var(--b)">Инициализация камеры…</div>'+
       '<div id="pm-hint" style="position:absolute;bottom:8px;left:8px;right:8px;font-size:12px;font-weight:700;text-align:center;background:rgba(2,4,8,.6);padding:6px 10px;border-radius:10px;color:var(--p)">Встань боком к камере, в полный рост</div>'+
      '</div>'+
      '<div class="flex items-center justify-between mt-3">'+
       '<div><div class="tiny muted">Приседания · повторений</div><div id="pm-reps" class="grad" style="font-size:34px;font-weight:800;line-height:1">0</div></div>'+
       '<div style="text-align:center"><div class="tiny muted">Глубина последнего</div><div id="pm-q" style="font-size:20px;font-weight:800">—</div></div>'+
       '<button class="btn btn-sm" onclick="A.poseFlip()">'+ic('refresh-cw','lucide-sm')+'Камера</button>'+
      '</div>'+
     '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Закрыть</button></div>', true);
    window._pmFacing='user';
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('камера не поддерживается');
      await this.pmStart();
    }catch(err){
      const st=document.getElementById('pm-status');
      if(st) st.textContent='Не удалось: нужны интернет, HTTPS и разрешение на камеру';
    }
  },
  async pmStart(){
    const st=document.getElementById('pm-status');
    if(window._pmStream){ try{ window._pmStream.getTracks().forEach(t=>t.stop()); }catch(e){} }
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:window._pmFacing,width:{ideal:720}},audio:false});
    window._pmStream=stream;
    const video=document.getElementById('pm-video'); if(!video) return;
    video.srcObject=stream; await video.play();
    if(st) st.textContent='Загружаю AI-модель (full)…';
    if(!window._pmPl){
      const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      const model='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';
      try{ window._pmPl=await vision.PoseLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:model,delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:0.5,minTrackingConfidence:0.5}); }
      catch(e){ window._pmPl=await vision.PoseLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:model,delegate:'CPU'},runningMode:'VIDEO',numPoses:1}); }
    }
    if(st) st.textContent='Сканирую · боком к камере';
    const cv=document.getElementById('pm-cv'), ctx=cv.getContext('2d');
    const CONS=[[11,12],[11,13],[13,15],[12,14],[14,16],[23,24],[23,25],[25,27],[27,29],[29,31],[24,26],[26,28],[28,30],[30,32],[11,23],[12,24]];
    let prev=null, state='up', minKnee=180, reps=0;
    const smooth=n=>{ if(!prev){ prev=n.map(p=>({x:p.x,y:p.y,v:p.visibility})); return prev; }
      n.forEach((p,i)=>{ prev[i].x+=(p.x-prev[i].x)*0.55; prev[i].y+=(p.y-prev[i].y)*0.55; prev[i].v=p.visibility; }); return prev; };
    const loop=()=>{
      const v=document.getElementById('pm-video'); if(!v){ prev=null; return; }
      if(v.readyState>=2){
        if(cv.width!==v.videoWidth&&v.videoWidth){ cv.width=v.videoWidth; cv.height=v.videoHeight; }
        const res=window._pmPl.detectForVideo(v,performance.now());
        ctx.clearRect(0,0,cv.width,cv.height);
        const raw=res.landmarks&&res.landmarks[0];
        if(raw){
          const lm=smooth(raw); const c=tc();
          ctx.save(); ctx.translate(cv.width,0); ctx.scale(-1,1);
          ctx.strokeStyle=c.a; ctx.lineWidth=Math.max(3,cv.width/200); ctx.lineCap='round';
          ctx.shadowColor=c.a; ctx.shadowBlur=14;
          CONS.forEach(pr=>{ const p1=lm[pr[0]], p2=lm[pr[1]]; ctx.beginPath(); ctx.moveTo(p1.x*cv.width,p1.y*cv.height); ctx.lineTo(p2.x*cv.width,p2.y*cv.height); ctx.stroke(); });
          ctx.shadowBlur=0;
          ctx.fillStyle=c.b; lm.forEach((p,ix)=>{ if([0,1,2,3,7,8,9,10].indexOf(ix)>=0) return; ctx.beginPath(); ctx.arc(p.x*cv.width,p.y*cv.height,Math.max(4,cv.width/120),0,7); ctx.fill(); });
          ctx.restore();
          const L={vis:lm[25].visibility||1,h:lm[23],k:lm[25],a:lm[27]}, R={vis:lm[26].visibility||1,h:lm[24],k:lm[26],a:lm[28]};
          const knee=Math.round(Math.min(angleDeg(L.h,L.k,L.a),angleDeg(R.h,R.k,R.a)));
          const tilt=Math.round(Math.abs(Math.atan2((lm[11].x+lm[12].x)/2-(lm[23].x+lm[24].x)/2,(lm[11].y+lm[12].y)/2-(lm[23].y+lm[24].y)/2))*180/Math.PI);
          const badges=document.getElementById('pm-badges');
          if(badges) badges.innerHTML='<span style="font-size:10px;font-weight:800;background:rgba(2,4,8,.6);padding:3px 8px;border-radius:8px;color:var(--p)">колено '+knee+'°</span><span style="font-size:10px;font-weight:800;background:rgba(2,4,8,.6);padding:3px 8px;border-radius:8px;color:var(--p)">наклон '+tilt+'°</span>';
          const hint=document.getElementById('pm-hint');
          const vis=Math.min(lm[23].visibility||1,lm[25].visibility||1,lm[27].visibility||1);
          if(vis<0.45){ if(hint) hint.textContent='Не вижу тебя полностью — отойди дальше, чтобы было видно колени и стопы'; }
          else {
            if(state==='up'){ if(knee<150) state='down'; minKnee=knee; }
            else { minKnee=Math.min(minKnee,knee);
              if(knee>160){ state='up';
                const q=Math.max(0,Math.min(100,Math.round((160-minKnee)/55*100)));
                reps++; const el=document.getElementById('pm-reps'); if(el) el.textContent=reps;
                const qel=document.getElementById('pm-q'); if(qel) qel.textContent=q+'%';
                if(hint) hint.textContent=q>=85?'💪 Отлично! Глубина '+q+'%':q>=60?'Есть повторение · глубина '+q+'% — сядь глубже':'Малая глубина ('+q+'%) — опускайся до угла ~90°';
                if(DB.settings.vibrate&&navigator.vibrate) navigator.vibrate(q>=85?[60,40,60]:40);
                minKnee=180;
              } else if(hint&&reps===0&&state==='down') hint.textContent='Глубже… цель — угол колена ~90° (зелёная зона)';
            }
            if(hint&&state==='up'&&minKnee>165) hint.textContent=reps?'Выпрямляйся полностью — и снова вниз':'Опускайся — сядь до угла ~90° (зелёная зона)';
            const bw=Math.max(14,cv.width/22), bx=cv.width-bw-12, by=42, bh=cv.height-84;
            const depth=Math.max(0,Math.min(1,(160-knee)/55));
            ctx.fillStyle='rgba(2,4,8,.5)'; ctx.fillRect(bx,by,bw,bh);
            ctx.fillStyle='rgba(62,207,142,.32)'; ctx.fillRect(bx,by,bw,bh*0.4);
            const fh=bh*depth;
            ctx.fillStyle=c.b; ctx.fillRect(bx,by+bh-fh,bw,fh);
            ctx.fillStyle='#f8fafc'; ctx.fillRect(bx-2,by+bh-fh-2,bw+4,4);
          }
        } else {
          const hint=document.getElementById('pm-hint'); if(hint) hint.textContent='Не вижу позу — отойди дальше, чтобы было видно всё тело';
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  async poseFlip(){ window._pmFacing=window._pmFacing==='user'?'environment':'user'; try{ await this.pmStart(); }catch(e){ const st=document.getElementById('pm-status'); if(st) st.textContent='Эта камера недоступна'; } },

  /* карточка результата */
  shareCard(){
    openModal(mHead('Карточка результата · PNG')+
     '<div class="modal-b"><canvas id="sh-cv" width="1080" height="1350" style="width:100%;border-radius:14px;display:block"></canvas><p class="tiny muted2 mt-2 text-center">Скачай и поделись в сторис — пусть знают, кто тут в форме</p></div>'+
     '<div class="modal-f"><button class="btn" onclick="A.closeModal()">Закрыть</button><button class="btn btn-g" onclick="A.shareDl()">'+ic('down','lucide-sm')+'Скачать PNG</button></div>', true);
    drawShare();
  },
  shareDl(){
    const cv=document.getElementById('sh-cv'); if(!cv) return;
    cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='fitpwa-results.png'; a.click(); URL.revokeObjectURL(a.href); });

  /* PDF-отчёт */
  printReport(){
    fillReport(); window.print();

  /* AI-парсер программы из текста */
  peTextModal(){
    openModal(mHead(ic('sparkles')+' AI-парсер программы')+
     '<div class="modal-b"><label>Вставь текст программы в любом виде</label><textarea id="pe-txt" rows="8" placeholder="День 1 — Грудь&#10;Жим лёжа 4х10 70кг&#10;Разводка гантелей 3х12 10кг&#10;День 2 — Спина&#10;Подтягивания 4х8"></textarea><p class="tiny muted mt-2">AI превратит текст в дни и упражнения конструктора. Работает с любым списком — даже из чата или заметок.</p></div>'+
     '<div class="modal-f"><button class="btn" onclick="A.closeModal()">Отмена</button><button class="btn btn-g" onclick="A.peParse()">Разобрать ✨</button></div>');
  },
  async peParse(){
    const ta=document.getElementById('pe-txt'); const txt=ta?ta.value.trim():''; if(!txt){ toast('Вставь текст'); return; }
    let days=null;
    try{
      if(navigator.onLine){
        const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'Преобразуй текст программы тренировок СТРОГО в JSON без пояснений и markdown: {"days":[{"title":"День 1 · Название","ex":["Упражнение 4x10 70кг","..."]}]}. Сгруппируй упражнения по дням из текста. Если дней нет — один день «День 1».'},{role:'user',content:txt}],model:'openai'})});
        let t=(await r.text()||'').trim().replace(/```json|```/g,'').trim();
        const m=t.match(/\{[\s\S]*\}/);
        if(m){ const j=JSON.parse(m[0]); if(j.days&&j.days.length) days=j.days; }
      }
    }catch(e){}
    if(!days){
      days=[];
      txt.split('\n').forEach(line=>{ const L=line.trim(); if(!L) return;
        if(/^(день|day)\b/i.test(L)||(L.length<45&&/—|-\s|:/.test(L)&&!/х\s*\d/i.test(L))){ days.push({title:L.replace(/^(\d+[.)]|#)\s*/,''),ex:[]}); }
        else { if(!days.length) days.push({title:'День 1',ex:[]}); days[days.length-1].ex.push(L.replace(/^[-•*]\s*/,'')); }
      });
    }
    days=(days||[]).filter(d=>d&&d.title);
    if(!days.length||!days.some(d=>d.ex&&d.ex.length)){ toast('Не разобрал — попробуй яснее сформулировать'); return; }
    PE.days=days.map(d=>({title:String(d.title),ex:(d.ex||[]).map(String)}));
    S.peDay=0; closeModal(); render(); toast('Программа разобрана ✨');
  },

  /* экран зала */
  gymOpen(){
    const tm={P:'Персональная',G:'Группа',O:'Онлайн'};
    const list=DB.tToday.map(s=>'<div class="row-i" style="padding:16px 0"><span class="dot" style="width:12px;height:12px;background:'+TYPE(s.type).c+'"></span><div style="flex:1"><b style="font-size:24px">'+esc(s.name)+'</b><div class="muted">'+tm[s.type]+' · '+s.dur+'</div></div><b style="font-size:28px">'+s.t+'</b></div>').join('');
    document.getElementById('rest-overlay').innerHTML='<div class="rest-ov" style="align-items:flex-start;overflow-y:auto"><div style="width:100%;max-width:920px;margin:auto;padding:36px">'+
     '<div class="flex items-center justify-between"><div class="grad" style="font-size:28px;font-weight:800;letter-spacing:.14em">FITPWA · ЗАЛ</div><button class="btn-ic" onclick="A.gymClose()" style="width:48px;height:48px">'+ic('x','lucide-lg')+'</button></div>'+
     '<div id="gym-clock" style="font-size:min(15vw,110px);font-weight:800;text-align:center;margin:30px 0;font-variant-numeric:tabular-nums" class="grad">--:--</div>'+
     '<div class="glass p-6">'+(list||'<p class="muted">Сегодня сессий нет</p>')+'</div>'+
     '<p class="tiny muted2 text-center mt-4">Экран зала — выведи на планшет в зале · Esc — закрыть</p></div></div>';
    icons();
    if(window._gymI) clearInterval(window._gymI);
    window._gymI=setInterval(()=>{ const el=document.getElementById('gym-clock'); if(!el){ clearInterval(window._gymI); return; } const d=new Date(); el.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2); },1000);
  },
  gymClose(){ if(window._gymI) clearInterval(window._gymI); document.getElementById('rest-overlay').innerHTML=''; },

  /* клиент: профиль */
  tgl(k){ DB.settings[k]=!DB.settings[k]; save(); render(); },
  tglTheme(){ DB.settings.theme=DB.settings.theme==='cyber'?'classic':'cyber'; save(); applyTheme(); render(); toast(DB.settings.theme==='cyber'?'Киберпанк-режим включён ⚡':'Классическая тема'); },

  /* тренер: клиенты */
  clSearch(q){ S.libQ=q; const el=document.getElementById('cl-list'); if(el){ el.innerHTML=clientsListHTML(q); icons(); } },
  clientModal(){
    openModal(mHead('Новый клиент')+'<div class="modal-b space-y-3">'+
     '<div><label>Имя и фамилия</label><input id="nc-name" placeholder="Например: Павел Зайцев"/></div>'+
     '<div><label>Телефон</label><input id="nc-phone" placeholder="+7 ___ ___-__-__"/></div>'+
     '<div><label>Цель</label><input id="nc-goal" placeholder="Снижение веса / масса / тонус"/></div>'+
     '<div><label>Абонемент</label><select id="nc-fee"><option value="7000">Standard · 7 000 ₽/мес</option><option value="8000">Premium · 8 000 ₽/мес</option><option value="12000">Elite · 12 000 ₽/мес</option></select></div>'+
    '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Отмена</button><button class="btn btn-g" onclick="A.clientAdd()">Добавить</button></div>');
  },
  clientAdd(){
    const name=document.getElementById('nc-name').value.trim();
    if(!name){ toast('Укажите имя'); return; }
    DB.tClients.unshift({id:uid(),name:name,phone:document.getElementById('nc-phone').value,goal:document.getElementById('nc-goal').value||'—',status:'Новый',next:'—',program:'Подбор программы',fee:+document.getElementById('nc-fee').value});
    save(); closeModal(); render(); toast('Клиент добавлен ✅');
  },
  clientInfo(id){
    const c=DB.tClients.find(x=>x.id===id); if(!c) return;
    openModal(mHead(esc(c.name))+'<div class="modal-b space-y-2">'+
     '<div class="flex justify-between"><span class="muted small">Статус</span><span class="badge '+STC[c.status]+'">'+c.status+'</span></div>'+
     '<div class="flex justify-between"><span class="muted small">Цель</span><b class="small">'+esc(c.goal)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Программа</span><b class="small">'+esc(c.program)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Следующая сессия</span><b class="small">'+c.next+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Телефон</span><b class="small">'+esc(c.phone)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Email</span><b class="small">'+esc(c.email)+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Абонемент</span><b class="small">'+money(c.fee)+'/мес</b></div>'+
    '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Закрыть</button></div>');
  },

  /* тренер: заявки */
  reqOk(id){ DB.requests=DB.requests.filter(r=>r.id!==id); save(); render(); toast('Заявка принята ✅'); },
  reqNo(id){ DB.requests=DB.requests.filter(r=>r.id!==id); save(); render(); toast('Заявка отклонена'); },

  /* тренер: конструктор */
  peOpen(id){
    const p=id?DB.programs.find(x=>x.id===id):null;
    PE={name:p?p.name:'',client:DB.tClients[0].name,days:p?Array.from({length:p.days},(_,i)=>({title:'День '+(i+1),ex:[]})):[{title:'День 1',ex:[]}],srcId:p?p.id:null};
    S.peDay=0; S.progOpen=true; render(); window.scrollTo(0,0);
  },
  peClose(){ S.progOpen=null; render(); },
  peSelect(i){ S.peDay=i; render(); },
  peAddDay(){ PE.days.push({title:'День '+(PE.days.length+1),ex:[]}); S.peDay=PE.days.length-1; render(); },
  peDelDay(i){ PE.days.splice(i,1); if(!PE.days.length) PE.days.push({title:'День 1',ex:[]}); S.peDay=0; render(); },
  peDelEx(di,xi){ PE.days[di].ex.splice(xi,1); render(); },
  peAdd(name){ PE.days[S.peDay].ex.push(name); render(); toast('Добавлено: '+name); },
  peDrop(ev,di){
    ev.preventDefault(); S.peDay=di;
    const txt=ev.dataTransfer.getData('text/plain');
    if(!txt) return;
    if(txt.indexOf('day:')===0){ const from=+txt.slice(4); const d=PE.days.splice(from,1)[0]; PE.days.splice(di,0,d); S.peDay=di; }
    else PE.days[di].ex.push(txt);
    render();
  },
  peDayDrag(i){ event.dataTransfer.setData('text/plain','day:'+i); },
  peLibDrag(name){ event.dataTransfer.setData('text/plain',name); },
  libGroup(g){ S.libGroup=g; S.libQ=''; render(); },
  libSearch(q){ S.libQ=q; const el=document.getElementById('lib-list'); if(el){ const items=LIB[S.libGroup].filter(x=>!q||x.toLowerCase().includes(q.toLowerCase())); el.innerHTML=items.map(x=>'<div class="lib-item" draggable="true" ondragstart="A.peLibDrag(\''+x.replace(/'/g,"\\'")+'\')" onclick="A.peAdd(\''+x.replace(/'/g,"\\'")+'\')"><span>'+esc(x)+'</span>'+ic('plus','lucide-sm muted')+'</div>').join(''); icons(); } },
  peSave(){
    const name=(PE.name||'').trim()||'Новая программа';
    const filled=PE.days.filter(d=>d.ex.length).length;
    if(!filled){ toast('Добавьте упражнения хотя бы в один день'); return; }
    if(PE.srcId){ const p=DB.programs.find(x=>x.id===PE.srcId); p.name=name; p.days=filled; p.ex=PE.days.reduce((a,d)=>a+d.ex.length,0); }
    else DB.programs.unshift({id:uid(),name:name,days:filled,ex:PE.days.reduce((a,d)=>a+d.ex.length,0),tag:'Новая'});
    save(); S.progOpen=null; S.tView='workouts'; render(); toast('Программа сохранена ✅');
  },

  /* тренер: расписание */
  sessModal(){
    openModal(mHead('Новая сессия')+'<div class="modal-b space-y-3">'+
     '<div><label>Клиент / группа</label><select id="ns-name">'+DB.tClients.map(c=>'<option>'+esc(c.name)+'</option>').join('')+'<option>Группа · Кроссфит</option><option>Группа · Стретчинг</option></select></div>'+
     '<div class="grid grid-cols-2 gap-3"><div><label>День недели</label><select id="ns-day">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>'<option value="'+i+'">'+d+'</option>').join('')+'</select></div>'+
     '<div><label>Время</label><input id="ns-time" type="time" value="09:00"/></div></div>'+
     '<div><label>Тип</label><select id="ns-type"><option value="P">Персональная</option><option value="G">Групповая</option><option value="O">Онлайн</option><option value="R">Отдых</option></select></div>'+
    '</div><div class="modal-f"><button class="btn" onclick="A.closeModal()">Отмена</button><button class="btn btn-g" onclick="A.sessAdd()">Добавить</button></div>');
  },
  sessAdd(){
    DB.tSchedule.push({d:+document.getElementById('ns-day').value,t:document.getElementById('ns-time').value,name:document.getElementById('ns-name').value,type:document.getElementById('ns-type').value});
    save(); closeModal(); render(); toast('Сессия добавлена ✅');
  },
  sessInfo(day,t){
    const s=DB.tSchedule.find(x=>x.d===day&&x.t===t); if(!s) return;
    const names={P:'Персональная',G:'Групповая',O:'Онлайн',R:'Отдых'};
    openModal(mHead(esc(s.name))+'<div class="modal-b space-y-2">'+
     '<div class="flex justify-between"><span class="muted small">Тип</span><b class="small">'+names[s.type]+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">День</span><b class="small">'+['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'][day]+'</b></div>'+
     '<div class="flex justify-between"><span class="muted small">Время</span><b class="small">'+s.t+'</b></div>'+
    '</div><div class="modal-f"><button class="btn btn-g" onclick="A.closeModal()">Ок</button></div>');
  },

  /* таймер */
  rtSkip(){ rtSkip(); },
  rtAdd(){ rtAdd(); },
  rtPreset(s){ RT.total=s; RT.left=s; paintRT(); }
};

load();
render();
 if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
 }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&document.querySelector('#rest-overlay .rest-ov')) A.gymClose(); });
</script>
